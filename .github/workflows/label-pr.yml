name: Label PR

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # Labels open PRs and PRs merged since the latest release.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: true

jobs:
  label:
    name: Label PR
    runs-on: ubuntu-latest
    steps:
      # Checks out the base branch, never PR code, so pull_request_target stays safe.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Label PR
        uses: ./
